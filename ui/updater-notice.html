<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>업데이트 준비 완료</title>
  <link rel="stylesheet" href="updater-notice.css">
  <script src="updater-guard.js"></script>
  <script src="updater-notice.js" defer></script>
</head>
<body>
  <main aria-labelledby="notice-title">
    <p class="eyebrow">AGENT GIBBON · 업데이트</p>
    <h1 id="notice-title">새 버전이 준비됐습니다</h1>
    <p id="notice-version" class="version" aria-live="polite"></p>
    <p id="notice-message" role="status" aria-live="polite">안전 상태를 확인하고 있습니다.</p>
    <p class="detail">작업을 강제로 종료하지 않습니다. 지금 설치를 선택하면 작업 보호 조건을 다시 확인합니다.</p>
    <div class="actions">
      <button id="notice-dismiss" type="button">나중에</button>
      <button id="notice-install" type="button" disabled>업데이트하고 재시작</button>
    </div>
  </main>
</body>
</html>
