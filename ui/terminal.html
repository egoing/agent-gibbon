<!doctype html><html lang="ko"><head><script src="telemetry.js"></script><script src="updater-guard.js"></script><script src="local-flow.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>터미널</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="vendor/xterm.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="terminal.css"><script type="module" src="memo-focus.js"></script><link rel="stylesheet" href="memo-frame.css"></head><body><div id="memo-surface"><header><div id="controls" role="toolbar" aria-label="Toolbar">
