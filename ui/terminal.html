<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>터미널</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="vendor/xterm.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="terminal.css"></head><body><div id="memo-surface"><header><span id="title">터미널</span></header><div id="controls" role="toolbar" aria-label="Toolbar">
<button id="toolbar-previous" aria-label="이전 도구" aria-controls="toolbar-items" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
<div id="toolbar-items">
<span id="dev-instance" hidden></span>

<button id="font-size" aria-label="글자 크기 13px, 클릭하여 변경" title="글자 크기 13px · 클릭하여 변경"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11v9M9 13c-2-4-7-2-7 2s5 6 7 2M12 20l4.5-16L21 20M14 14h5"/></svg></button>


<button id="copy" aria-label="선택한 텍스트 복사" title="선택한 텍스트 복사"><svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="1"/><path d="M16 8V3H3v13h5"/></svg></button>

<button id="pin" aria-label="상단 고정" aria-pressed="true" title="상단 고정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-1 7 4 4v2H5v-2l4-4-1-7Z"/><path d="M12 16v6"/></svg></button><button id="close" aria-label="터미널 숨기기" title="터미널 숨기기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<button id="toolbar-next" aria-label="다음 도구" aria-controls="toolbar-items" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
</div>
<section id="welcome" hidden aria-label="작업 시작" aria-busy="false"><div class="welcome-content">
<section aria-labelledby="location-heading"><h1 id="location-heading">작업 위치</h1>
<button id="choose-folder" class="plain-row"><span aria-hidden="true">📂</span> 폴더 열기…</button>
<div id="recent-folders" aria-label="최근 폴더"></div>
<button id="more-folders" class="plain-row" aria-expanded="false" hidden>더 보기…</button>
<p id="home-hint" hidden>홈 폴더에서 시작합니다.</p></section>
<section class="tasks-section" aria-labelledby="tasks-heading"><h2 id="tasks-heading">추천 작업</h2><div id="recommendations" aria-label="추천 작업"></div></section>
<button id="run-task">실행</button>
<pre id="command-preview" tabindex="0" aria-label="실행 명령 미리보기" aria-live="polite"></pre>
<details id="title-details"><summary>창 제목 변경</summary><form id="rename-form"><label for="rename-title">제목</label><input id="rename-title" maxlength="120" placeholder="비우면 폴더명 사용"><button type="submit">적용</button></form></details>
</div></section><div id="status" role="status"></div><main id="terminal" aria-label="에이전트 터미널"></main></div><div class="resize" data-direction="North" id="n"></div><div class="resize" data-direction="South" id="s"></div><div class="resize" data-direction="East" id="e"></div><div class="resize" data-direction="West" id="w"></div><div class="resize corner" data-direction="NorthWest" id="nw"></div><div class="resize corner" data-direction="NorthEast" id="ne"></div><div class="resize corner" data-direction="SouthWest" id="sw"></div><div class="resize corner" data-direction="SouthEast" id="se"></div>
<script src="vendor/xterm.js"></script><script src="vendor/addon-fit.js"></script><script src="terminal-ime.js"></script><script src="terminal.js"></script><script type="module" src="toolbar.js"></script></body></html>
