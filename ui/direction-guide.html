<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<link rel="stylesheet" href="direction-guide.css">
<body>
<svg viewBox="0 0 240 240" role="img" aria-labelledby="action">
  <title id="action">위로 바둑판 정렬, 오른쪽으로 오른쪽 정렬, 아래로 전체 숨기기, 왼쪽 이동 또는 Esc 키로 취소</title>
  <g class="tile"><use href="direction-guide.svg#tile"/></g>
  <g class="right"><use href="direction-guide.svg#right"/></g>
  <g class="cancel"><use href="direction-guide.svg#cancel"/></g>
  <g class="down">
    <use class="hide" href="direction-guide.svg#hide"/>
    <use class="restore" href="direction-guide-restore.svg#restore"/>
  </g>
</svg>
<script src="direction-guide.js"></script>
</body>
</html>
