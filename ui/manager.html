<!doctype html>
<html lang="ko"><head><script src="telemetry.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메모 관리</title><link rel="stylesheet" href="manager.css"><script src="manager.js" defer></script></head>
<body><header><strong>Agent Gibbon</strong><nav aria-label="관리 탐색"><button id="notes-nav" aria-pressed="true">모든 메모</button><button id="settings-nav" aria-pressed="false">설정</button></nav></header>
<div id="error" role="alert" hidden>메모를 읽지 못했습니다. <button id="retry">다시 시도</button></div>
<main id="notes-page"><aside aria-label="메모 목록"><div class="list-heading"><h2>모든 메모</h2><button id="refresh" aria-label="메모 목록 새로고침">새로고침</button></div><div id="list"></div></aside><section id="detail" aria-label="메모 상세" tabindex="0"><p>메모를 선택하세요.</p></section></main>
<section id="settings-page" hidden><h1>설정</h1><p>아직 설정 항목이 없습니다.</p></section></body></html>
