<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>외부 앱</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="terminal.css"><link rel="stylesheet" href="external-apps.css"></head><body><section id="welcome" aria-label="외부 앱 선택" aria-busy="false"><div class="welcome-content">
<h1>앱 선택</h1><p id="region"></p><p class="hint">앱을 선택한 다음 실행하면 선택 영역에 상단 고정합니다.</p>
<label for="search">설치된 앱 / 열린 창 검색</label><input id="search" type="search" autocomplete="off">
<div id="apps" aria-label="설치된 앱"></div><h2>열린 창</h2><p class="hint">기존 창은 직접 선택해야 이동합니다. 최소화·최대화 창은 보통 크기로 복원한 뒤 선택하세요.</p><div id="windows" aria-label="열린 창"></div>
<div class="actions"><button id="run-task" disabled>실행</button><button id="refresh">새로 고침</button><button id="cancel">취소</button></div>
<p id="status" role="status" aria-live="polite"></p><p id="limit" class="hint"></p>
<h2>플로팅 중인 창</h2><div id="sessions"></div><p class="hint">해제는 원래 위치·크기·상단 고정을 복원합니다. 앱을 종료하지 않습니다. 트레이에서도 이 인스턴스의 모든 고정을 해제할 수 있습니다.</p>
</div></section><script src="external-apps.js"></script></body></html>
