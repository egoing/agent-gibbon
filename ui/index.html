<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jajan</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="memo-toolbar.css"><link rel="stylesheet" href="feedback.css"><script src="telemetry.js"></script><script src="updater-guard.js"></script><script src="local-flow.js"></script><script src="region-frame.js"></script><script type="module" src="app.js"></script><script defer src="relation-toolbar.js"></script><script type="module" src="toolbar.js"></script><script type="module" src="memo-focus.js"></script><link rel="stylesheet" href="memo-frame.css"><link rel="stylesheet" href="overlay-scrollbar.css"><script type="module" src="overlay-scrollbar.js"></script></head>
<body class="text-note">
<div id="memo-surface">
<div id="controls" role="toolbar" aria-label="메모 도구" data-kind="text"><script src="content-size.js"></script><script src="memo-toolbar.js"></script></div>
<main id="viewport" aria-label="메모 내용" tabindex="0">
<div id="fold-title" hidden></div>
<div id="content"></div>
<section id="editor" aria-label="메모 본문 편집"></section>
</main>
<section id="feedback" hidden aria-label="Feedback"><span id="message" role="status" aria-live="polite" aria-atomic="true"></span><div id="actions" role="group" aria-label="Action Bar"></div></section>
<div id="memo-scrollbar" role="scrollbar" tabindex="0" aria-label="메모 세로 스크롤" aria-controls="viewport" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" hidden></div>
</div>
<div class="resize" data-direction="North" id="n"></div><div class="resize" data-direction="South" id="s"></div><div class="resize" data-direction="East" id="e"></div><div class="resize" data-direction="West" id="w"></div><div class="resize corner" data-direction="NorthWest" id="nw"></div><div class="resize corner" data-direction="NorthEast" id="ne"></div><div class="resize corner" data-direction="SouthWest" id="sw"></div><div class="resize corner" data-direction="SouthEast" id="se"></div>
</body></html>
