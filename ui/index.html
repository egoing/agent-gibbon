<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Gibbon</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="feedback.css"><script src="telemetry.js"></script><script src="updater-guard.js"></script><script src="local-flow.js"></script><script type="module" src="app.js"></script><script type="module" src="toolbar.js"></script><script type="module" src="memo-focus.js"></script><link rel="stylesheet" href="memo-frame.css"><link rel="stylesheet" href="overlay-scrollbar.css"><script type="module" src="overlay-scrollbar.js"></script></head>
<body>
<div id="memo-surface">
<div id="controls" role="toolbar" aria-label="Toolbar">
<span id="chrome-title"></span><button id="toolbar-previous" aria-label="이전 도구" aria-controls="toolbar-items" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
<div id="toolbar-items">

<button id="fold-toggle" hidden aria-label="메모 접기" aria-expanded="true" title="메모 접기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4h-6a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h8" />
  <path d="M18 20v-17" />
  <path d="M15 6l3 -3l3 3" /></svg></button>
<button id="font-size" aria-label="글자 크기 12px, 클릭하여 변경" title="글자 크기 12px · 클릭하여 변경"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7v-2h13v2" />
  <path d="M10 5v14" />
  <path d="M12 19h-4" />
  <path d="M15 13v-1h6v1" />
  <path d="M18 12v7" />
  <path d="M17 19h2" /></svg></button>
<button id="edit" aria-label="메모 편집" title="메모 편집" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" />
  <path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" />
  <path d="M16 5l3 3" /></svg></button>
<button id="export" aria-label="파일로 저장" title="파일로 저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l16 0" />
  <path d="M12 14l0 -10" />
  <path d="M12 14l4 -4" />
  <path d="M12 14l-4 -4" /></svg></button>
<button id="copy" aria-label="본문 복사" title="본문 복사"><svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z" />
  <path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" /></svg></button>
<button id="warp" aria-label="반대편으로 워프" title="반대편으로 워프"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="warp-left"><path d="M14 3v4a1 1 0 0 0 1 1h4" />
  <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
  <path d="M15 15h-6" />
  <path d="M11.5 17.5l-2.5 -2.5l2.5 -2.5" /></g><g class="warp-right"><path d="M14 3v4a1 1 0 0 0 1 1h4" />
  <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
  <path d="M9 15h6" />
  <path d="M12.5 17.5l2.5 -2.5l-2.5 -2.5" /></g></svg></button>
<button id="pin" aria-label="상단 고정" aria-pressed="true" title="상단 고정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 4l8 4l8 -4l-8 -4" fill="currentColor" />
  <path d="M8 14l-4 2l8 4l8 -4l-4 -2" />
  <path d="M8 10l-4 2l8 4l8 -4l-4 -2" /></svg></button>
</div>
<button id="toolbar-next" aria-label="다음 도구" aria-controls="toolbar-items" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
<button id="toolbar-toggle" aria-label="툴바 접기" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4h-6a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h8" />
  <path d="M18 20v-17" />
  <path d="M15 6l3 -3l3 3" /></svg></button><button id="close" aria-label="메모 창 닫기" title="메모 창 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12" />
  <path d="M6 6l12 12" /></svg></button></div>
<main id="viewport" aria-label="메모 내용" tabindex="0">
<div id="fold-title" hidden></div>
<div id="content"></div>
<section id="editor" hidden aria-label="Markdown 편집">
<textarea id="markdown" aria-label="Markdown 원문" spellcheck="false"></textarea>
</section>
</main>
<section id="feedback" hidden aria-label="Feedback"><span id="message" role="status" aria-live="polite" aria-atomic="true"></span><div id="actions" role="group" aria-label="Action Bar"></div></section>
<div id="memo-scrollbar" role="scrollbar" tabindex="0" aria-label="메모 세로 스크롤" aria-controls="viewport" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" hidden></div>
</div>
<div class="resize" data-direction="North" id="n"></div><div class="resize" data-direction="South" id="s"></div><div class="resize" data-direction="East" id="e"></div><div class="resize" data-direction="West" id="w"></div><div class="resize corner" data-direction="NorthWest" id="nw"></div><div class="resize corner" data-direction="NorthEast" id="ne"></div><div class="resize corner" data-direction="SouthWest" id="sw"></div><div class="resize corner" data-direction="SouthEast" id="se"></div>
</body></html>
