<!doctype html>
<html lang="ko" data-theme-view="permission">
<head>
  <meta charset="utf-8">
  <title data-l10n="text">Jajan 권한 설정</title>
  <link rel="stylesheet" href="language.css">
  <link rel="stylesheet" href="permission.css">
  <script src="generated/messages.js"></script>
  <script src="language.js"></script>
  <script src="manager-theme.js"></script>
</head>
<body>
  <main>
    <img src="permission-icon.png" alt="">
    <h1 data-l10n="text">Jajan 권한 설정</h1>
    <section>
      <span class="symbol" aria-hidden="true">ⓘ</span>
      <div><strong data-l10n="text">손쉬운 사용</strong><small data-l10n="text">보조키로 창을 숨길 때 필요합니다.</small></div>
      <button id="access" data-l10n="text" disabled>확인 중</button>
    </section>
    <section>
      <span class="symbol" aria-hidden="true">▣</span>
      <div><strong data-l10n="text">화면 캡처</strong><small data-l10n="text">영역을 선택할 때 필요합니다.</small></div>
      <button id="screen" data-l10n="text" disabled>확인 중</button>
    </section>
    <div id="follow-up" hidden>
      <p role="status" id="hint"></p>
      <details>
        <summary data-l10n="text">진단용 실행 파일 경로</summary>
        <p id="application-label" data-l10n="text">설정에 추가할 앱</p>
        <code id="application-path"></code>
        <code id="path"></code>
      </details>
    </div>
  </main>
  <script src="permission.js"></script>
</body>
</html>
