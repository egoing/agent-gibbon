name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: version
        name: Check versions and tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            VERSION=$(node scripts/release-version.mjs check "$RELEASE_TAG")
          else
            VERSION=$(node scripts/release-version.mjs check)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset: darwin-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            asset: darwin-x86_64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust tools
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add '${{ matrix.target }}'
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-bin: false
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run test:ui
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build installers
        shell: bash
        env:
          AGENT_GIBBON_SENTRY_DSN: ${{ secrets.AGENT_GIBBON_SENTRY_DSN || vars.AGENT_GIBBON_SENTRY_DSN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if [ -z "$AGENT_GIBBON_SENTRY_DSN" ]; then
            echo '::warning::Sentry DSN is not configured; these binaries will not send diagnostics.'
          fi
          if [ -n "$RELEASE_TAG" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_UPDATER_PUBLIC_KEY" ]; then
              echo '::error::Tagged releases require TAURI_SIGNING_PRIVATE_KEY and the TAURI_UPDATER_PUBLIC_KEY repository variable.'
              exit 1
            fi
          else
            # Manual runs validate updater builds with a disposable per-runner key; it is never published.
            ephemeral_key="$RUNNER_TEMP/tauri-updater.key"
            npm exec -- tauri signer generate --write-keys "$ephemeral_key" --ci >/dev/null 2>&1
            TAURI_SIGNING_PRIVATE_KEY="$ephemeral_key"
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
            TAURI_UPDATER_PUBLIC_KEY="$(cat "$ephemeral_key.pub")"
          fi
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBLIC_KEY
          node scripts/updater-build-config.mjs "$RUNNER_TEMP/updater-build-config.json"
          npm exec tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config "$RUNNER_TEMP/updater-build-config.json" -- --locked
      - name: Collect installers
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            TAURI_SIGNING_PRIVATE_KEY=''
            TAURI_SIGNING_PRIVATE_KEY_PATH="$RUNNER_TEMP/tauri-updater.key"
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
            TAURI_UPDATER_PUBLIC_KEY="$(cat "$RUNNER_TEMP/tauri-updater.key.pub")"
          elif [ -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            TAURI_SIGNING_PRIVATE_KEY_PATH="$TAURI_SIGNING_PRIVATE_KEY"
            TAURI_SIGNING_PRIVATE_KEY=''
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY_PATH
          else
            unset TAURI_SIGNING_PRIVATE_KEY_PATH
          fi
          if { [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -z "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}" ]; } || [ -z "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            echo 'Updater signing key material is unavailable in the artifact collection job.'
            exit 1
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}" ]; then unset TAURI_SIGNING_PRIVATE_KEY; else export TAURI_SIGNING_PRIVATE_KEY; fi
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          mkdir -p release-assets
          if [ '${{ matrix.target }}' = 'aarch64-apple-darwin' ] || [ '${{ matrix.target }}' = 'x86_64-apple-darwin' ]; then
            shopt -s nullglob
            dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
            if [ "${#dmgs[@]}" -ne 1 ]; then
              echo 'Expected exactly one macOS DMG installer.'
              exit 1
            fi
            if [ '${{ matrix.target }}' = 'aarch64-apple-darwin' ]; then installer_name="Agent.Gibbon_${{ needs.validate.outputs.version }}_aarch64.dmg"; else installer_name="Agent.Gibbon_${{ needs.validate.outputs.version }}_x64.dmg"; fi
            cp "${dmgs[0]}" "release-assets/$installer_name"
            bundles=(src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)
            if [ "${#bundles[@]}" -ne 1 ] || [ ! -f "${bundles[0]}.sig" ]; then
              echo 'Expected exactly one signed macOS updater archive.'
              exit 1
            fi
            if [ '${{ matrix.target }}' = 'aarch64-apple-darwin' ]; then updater_name="Agent.Gibbon_${{ needs.validate.outputs.version }}_darwin-aarch64.app.tar.gz"; else updater_name="Agent.Gibbon_${{ needs.validate.outputs.version }}_darwin-x86_64.app.tar.gz"; fi
            cp "${bundles[0]}" "release-assets/$updater_name"
            npm exec -- tauri signer sign --app-version "$RELEASE_VERSION" "release-assets/$updater_name" >/dev/null 2>&1
            if [ '${{ matrix.target }}' = 'aarch64-apple-darwin' ]; then public_key_name='darwin-aarch64.pub'; else public_key_name='darwin-x86_64.pub'; fi
          else
            shopt -s nullglob
            installers=(src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)
            if [ "${#installers[@]}" -ne 1 ] || [ ! -f "${installers[0]}.sig" ]; then
              echo 'Expected exactly one signed Windows NSIS updater installer.'
              exit 1
            fi
            installer_name="Agent.Gibbon_${{ needs.validate.outputs.version }}_x64-setup.exe"
            cp "${installers[0]}" "release-assets/$installer_name"
            updater_name="$installer_name"
            npm exec -- tauri signer sign --app-version "$RELEASE_VERSION" "release-assets/$updater_name" >/dev/null 2>&1
            public_key_name='windows-x86_64.pub'
          fi
          printf '%s' "$TAURI_UPDATER_PUBLIC_KEY" > "release-assets/$public_key_name"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Validate signed updater assets, generate manifest and checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release-assets.mjs release-assets "$RELEASE_VERSION" updater
      - uses: actions/upload-artifact@v4
        with:
          name: complete-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: complete-release-assets
          path: release-assets
      - name: Upload and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A failed upload leaves a draft for inspection. Never replace an existing release.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Agent Gibbon $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/*
          expected_assets="$(find release-assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo '::error::Uploaded release asset names differ from the validated local asset set.'
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('release-assets/latest.json', 'utf8'));
          const expectedTargets = ['darwin-aarch64', 'darwin-x86_64', 'windows-x86_64'];
          const targets = Object.keys(manifest.platforms).sort();
          if (JSON.stringify(targets) !== JSON.stringify(expectedTargets)) throw new Error('Updater manifest target set is incomplete.');
          if (`v${manifest.version}` !== process.env.RELEASE_TAG) throw new Error('Updater manifest version does not match the release tag.');
          const localNames = new Set(readdirSync('release-assets'));
          for (const target of expectedTargets) {
            const url = new URL(manifest.platforms[target].url);
            const filename = decodeURIComponent(url.pathname.split('/').at(-1));
            if (!filename.startsWith('Agent.Gibbon_') || filename.includes(' ') || !localNames.has(filename)) {
              throw new Error(`Updater manifest asset name is not present with its canonical filename: ${target}`);
            }
            if (url.origin !== 'https://github.com' || url.pathname !== `/${process.env.GH_REPO}/releases/download/${process.env.RELEASE_TAG}/${filename}`) {
              throw new Error(`Updater manifest URL does not point to this tagged release: ${target}`);
            }
          }
          NODE
