name: App Store Connect notarization authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - name: Check App Store Connect team key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          : "${APPLE_API_KEY_P8:?Missing APPLE_API_KEY_P8}" "${APPLE_API_KEY:?Missing APPLE_API_KEY}" "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$work/notary.p8"
          xcrun notarytool --version
          if xcrun notarytool history --key "$work/notary.p8" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --output-format json > /dev/null 2>"$work/errors"; then
            echo 'Apple notarization authentication succeeded.'
          else
            code=$(sed -nE 's/.*HTTP status code: ([0-9]{3}).*/\1/p' "$work/errors" | head -n 1)
            echo "::error::Apple notarization authentication failed (HTTP ${code:-unknown})."
            exit 1
          fi
