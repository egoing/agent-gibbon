name: Notary authentication diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - name: Check Apple notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}" "${APPLE_PASSWORD:?Missing APPLE_PASSWORD}" "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          [[ "$APPLE_TEAM_ID" == 5P84RWXNB6 ]] || { echo 'Unexpected team ID'; exit 1; }
          errors=$(mktemp)
          trap 'rm -f "$errors"' EXIT
          xcrun notarytool --version
          if xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --output-format json > /dev/null 2>"$errors"; then
            echo 'Apple notarization authentication succeeded.'
          else
            code=$(sed -nE 's/.*HTTP status code: ([0-9]{3}).*/\1/p' "$errors" | head -n 1)
            echo "::error::Apple notarization authentication failed (HTTP ${code:-unknown})."
            exit 1
          fi
