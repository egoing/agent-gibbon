[package]
name = "jajan"
version = "0.3.12"
edition = "2021"
license = "MIT"
default-run = "jajan"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "unstable"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
ammonia = "4"
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sentry = { version = "0.42", default-features = false, features = ["reqwest", "rustls", "panic", "contexts", "backtrace", "debug-images", "release-health", "logs"] }
tauri-plugin-global-shortcut = "2"
xcap = "0.7"
base64 = "0.22"
tauri-plugin-dialog = "2"
tempfile = "3"
portable-pty = "0.9"
tauri-plugin-updater = "2"

[features]
verification-updater = []
verification-roundtrip = ["verification-updater"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSURL", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["block2", "NSWindow", "NSEvent", "NSWorkspace", "NSRunningApplication", "NSScrollView", "NSScroller", "NSView", "libc", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
anyhow = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory"] }
uds_windows = "1.2.1"
winreg = "0.55"

# Full-screen pixel conversion/encoding must remain responsive in dev builds.
# Keep application code unoptimized for debugging.
[profile.dev.package.xcap]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
[profile.dev.package.base64]
opt-level = 2

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
