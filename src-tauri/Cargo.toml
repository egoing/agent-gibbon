[package]
name = "agent-gibbon"
version = "0.2.7"
edition = "2021"
license = "MIT"
default-run = "agent-gibbon"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
ammonia = "4"
fs2 = "0.4"
libc = "0.2"
sentry = { version = "0.42", default-features = false, features = ["reqwest", "rustls", "panic", "contexts"] }
tauri-plugin-global-shortcut = "2"
xcap = "0.7"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["block2", "NSWindow", "NSEvent", "NSWorkspace", "NSRunningApplication", "libc", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"

# Full-screen pixel conversion/encoding must remain responsive in dev builds.
# Keep application code unoptimized for debugging.
[profile.dev.package.xcap]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
[profile.dev.package.base64]
opt-level = 2
