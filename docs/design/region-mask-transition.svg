<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="810" height="204" viewBox="0 0 810 204">
<title>영역 선택 마스크 표시 순서</title>
<defs><g id="desktop"><rect width="246" height="116" rx="4" fill="#669391"/><rect x="18" y="18" width="132" height="76" rx="4" fill="#e0d5b1"/><path d="M26 38h112M26 52h78M26 66h93" stroke="#8c8060" stroke-width="3"/></g><rect id="outline" x="58" y="17" width="145" height="65" fill="none" stroke="white" stroke-opacity=".5"/></defs>
<rect width="810" height="204" fill="#fafafa"/>
<g font-family="sans-serif" fill="#292929" font-size="15">
<text x="16" y="25">선택 시작 · 기존 메모 경계</text><text x="282" y="25">드래그 · 바깥 음영 16%</text><text x="548" y="25">마스크 퇴장 · 바탕화면 복귀</text>
<g transform="translate(16 40)"><use xlink:href="#desktop"/><use xlink:href="#outline"/></g>
<g transform="translate(282 40)"><use xlink:href="#desktop"/><path d="M0 0h246v116H0z M78 37h96v55H78z" fill-rule="evenodd" opacity=".16"/><use xlink:href="#outline"/><rect x="78" y="37" width="96" height="55" fill="none" stroke="#75caff"/></g>
<g transform="translate(548 40)"><use xlink:href="#desktop"/><rect x="58" y="17" width="145" height="65" rx="4" fill="#e9dfad"/><text x="68" y="44" font-size="12">기존 메모</text></g>
<text x="16" y="186" font-size="13">기존 메모의 경계만 50%로 표시합니다. 경계 위에서도 드래그할 수 있으며 Esc를 누르면 원래 메모가 보입니다.</text></g></svg>
