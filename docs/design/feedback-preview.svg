<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter></defs><rect width="1120" height="860" fill="#f3f4f6"/><style>text{font-family:"Apple SD Gothic Neo",sans-serif;fill:#27313c}.label{font-size:14px;font-weight:600}.caption{font-size:12px;fill:#637080}.ui{font-size:11px}.body{font-size:12px}.title{font-size:15px;font-weight:600}</style><text x="32" y="40" font-size="23" font-weight="700">Agent Gibbon · Feedback 시안</text><text x="32" y="66" class="caption">제안 화면 · Memo 너비 300px 기준 · 배경의 회색은 다른 앱이 보이는 공간입니다</text><text x="32" y="110" class="label" >01  기본 상태</text><rect x="32" y="130" width="300" height="166" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="42" y="152" class="title" >디자인 시스템</text><text x="220" y="151" class="ui" opacity=".55">⌃   aA   ✎   ⧉   ×</text><text x="42" y="184" class="body" >작업에 필요한 내용만 조용히 곁에 둡니다.</text><text x="42" y="205" class="body" >☑ 용어 통일</text><text x="42" y="226" class="body" >☐ Feedback 시안 검토</text><text x="42" y="247" class="body" >☐ 실제 화면에서 크기 확인</text><text x="32" y="396" class="caption" >안내가 없으면 외부 영역도 없습니다.</text><text x="396" y="110" class="label" >02  Toast</text><rect x="396" y="130" width="300" height="166" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="406" y="152" class="title" >디자인 시스템</text><text x="584" y="151" class="ui" opacity=".55">⌃   aA   ✎   ⧉   ×</text><text x="406" y="184" class="body" >작업에 필요한 내용만 조용히 곁에 둡니다.</text><text x="406" y="205" class="body" >☑ 용어 통일</text><text x="406" y="226" class="body" >☐ Feedback 시안 검토</text><text x="406" y="247" class="body" >☐ 실제 화면에서 크기 확인</text><rect x="598" y="300" width="98" height="25" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="604" y="317" class="ui" >복사했습니다</text><text x="396" y="396" class="caption" >짧은 결과만 표시하고 자동으로 사라집니다.</text><text x="760" y="110" class="label" >03  Action Bar</text><rect x="760" y="130" width="300" height="166" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="770" y="152" class="title" >디자인 시스템</text><text x="948" y="151" class="ui" opacity=".55">⌃   aA   ✎   ⧉   ×</text><rect x="768" y="165" width="284" height="121" rx="2" fill="#fff9e5" stroke="#d9cfaf"/><text x="774" y="184" class="body" ># 디자인 시스템</text><text x="774" y="204" class="body" ></text><text x="774" y="224" class="body" >- [x] 용어 통일</text><text x="774" y="244" class="body" >- [ ] Feedback 시안 검토</text><rect x="968" y="300" width="92" height="32" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><rect x="974" y="305" width="38" height="22" rx="3" fill="none"/><text x="993.0" y="320" class="ui" text-anchor="middle">취소</text><rect x="1016" y="305" width="38" height="22" rx="3" fill="#e5d69f"/><text x="1035.0" y="320" class="ui" text-anchor="middle" font-weight="600">저장</text><text x="760" y="396" class="caption" >편집 중에는 취소·저장 버튼을 제공합니다.</text><text x="32" y="464" class="label" >04  안내가 있는 Action Bar</text><rect x="32" y="484" width="300" height="166" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="42" y="506" class="title" >디자인 시스템</text><text x="220" y="505" class="ui" opacity=".55">⌃   aA   ✎   ⧉   ×</text><rect x="40" y="519" width="284" height="121" rx="2" fill="#fff9e5" stroke="#d9cfaf"/><text x="46" y="538" class="body" ># 디자인 시스템</text><text x="46" y="558" class="body" ></text><text x="46" y="578" class="body" >- [x] 용어 통일</text><text x="46" y="598" class="body" >- [ ] Feedback 시안 검토</text><rect x="137" y="654" width="195" height="32" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="143" y="674" class="ui" >복사했습니다</text><rect x="246" y="659" width="38" height="22" rx="3" fill="none"/><text x="265.0" y="674" class="ui" text-anchor="middle">취소</text><rect x="288" y="659" width="38" height="22" rx="3" fill="#e5d69f"/><text x="307.0" y="674" class="ui" text-anchor="middle" font-weight="600">저장</text><text x="32" y="750" class="caption" >별도 Toast를 쌓지 않고 안내와 버튼을</text><text x="32" y="767" class="caption" >함께 표시합니다.</text><text x="396" y="464" class="label" >05  긴 안내</text><rect x="396" y="484" width="300" height="166" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="406" y="506" class="title" >디자인 시스템</text><text x="584" y="505" class="ui" opacity=".55">⌃   aA   ✎   ⧉   ×</text><rect x="404" y="519" width="284" height="121" rx="2" fill="#fff9e5" stroke="#d9cfaf"/><text x="410" y="538" class="body" ># 디자인 시스템</text><text x="410" y="558" class="body" ></text><text x="410" y="578" class="body" >- [x] 용어 통일</text><text x="410" y="598" class="body" >- [ ] Feedback 시안 검토</text><rect x="396" y="654" width="300" height="74" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="403" y="671" class="ui" >⚠ 저장하지 못했습니다. 원본 파일의 쓰기 권한을</text><text x="403" y="687" class="ui" >확인한 뒤 다시 저장해 주세요.</text><rect x="610" y="700" width="38" height="22" rx="3" fill="none"/><text x="629.0" y="715" class="ui" text-anchor="middle">취소</text><rect x="652" y="700" width="38" height="22" rx="3" fill="#e5d69f"/><text x="671.0" y="715" class="ui" text-anchor="middle" font-weight="600">저장</text><text x="396" y="750" class="caption" >Memo 너비 안에서 줄바꿈하고 버튼은</text><text x="396" y="767" class="caption" >오른쪽 아래에 둡니다.</text><text x="760" y="464" class="label" >06  변경 확인</text><rect x="760" y="484" width="300" height="166" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="770" y="506" class="title" >디자인 시스템</text><text x="948" y="505" class="ui" opacity=".55">⌃   aA   ✎   ⧉   ×</text><text x="770" y="538" class="body" >작업에 필요한 내용만 조용히 곁에 둡니다.</text><text x="770" y="559" class="body" >☑ 용어 통일</text><rect x="768" y="565" width="175" height="19" rx="2" fill="#e2eed1"/><text x="770" y="580" class="body" >☐ Feedback 시안 검토</text><text x="770" y="601" class="body" >☐ 실제 화면에서 크기 확인</text><rect x="904" y="654" width="156" height="32" rx="4" fill="#fff5cf" stroke="#c9bea0" filter="url(#shadow)"/><text x="910" y="674" class="ui" >변경사항</text><rect x="1016" y="659" width="38" height="22" rx="3" fill="#e5d69f"/><text x="1035.0" y="674" class="ui" text-anchor="middle" font-weight="600">확인</text><text x="760" y="750" class="caption" >확인을 누르면 변경 표시와 Action Bar가 사라집니다.</text><text x="32" y="818" class="caption">공통: 창 밖 아래 · 오른쪽 정렬 · 간격 4px · 내용에 맞는 너비 · 메모와 같은 색상 및 모서리</text><text x="32" y="840" class="caption">아래 공간이 부족하면 위로 전환합니다. 아이콘은 배치 설명용이며 실제 앱 구현 화면은 아닙니다.</text></svg>