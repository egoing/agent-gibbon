<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
<rect width="760" height="300" fill="#f8f8f8"/>
<g font-family="sans-serif" fill="#2d2d2d">
<text x="24" y="34" font-size="20" font-weight="bold">터미널 한글 조합 표시 · #62</text>
<text x="24" y="61" font-size="13">설명용 시안 — 한글 한 글자 = 터미널 두 칸 · 조합/확정 동일 폭</text>
<rect x="24" y="82" width="712" height="88" rx="4" fill="#20252e"/>
