<text x="44" y="235" font-size="18" fill="#f0f0f0">한</text><text x="62" y="235" font-size="18" fill="#f0f0f0">글</text><text x="116" y="233" font-size="13" fill="#cbd5e1">조합 때와 같은 글자 위치 · 조합 배경 해제</text>
