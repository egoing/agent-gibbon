<text x="44" y="143" font-size="18" fill="#f0f0f0">한</text><text x="62" y="143" font-size="18" fill="#fff">글</text>
<text x="116" y="142" font-size="13" fill="#cbd5e1">글자당 두 칸 유지 · 마지막 조합 글자만 검은 배경</text>
