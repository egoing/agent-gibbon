<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="820" viewBox="0 0 1160 820"><style>text{font-family:Arial,"Apple SD Gothic Neo",sans-serif;fill:#303537}.title{font-size:25px;font-weight:700}.sub{font-size:14px}.label{font-size:16px;font-weight:600}.small{font-size:12px}.screen{fill:#fff;stroke:#a9b1ad;stroke-width:2}.note{stroke:#687670;stroke-width:1.5;fill:#dfe2dd}.bar{fill:#b8c1ba}</style><rect width="1160" height="820" fill="#f6f7f4"/><text x="28" y="40" class="title">모니터가 달라져도, 작업은 이어서</text><text x="28" y="67" class="sub">#190 · 합의한 배치 정책 설명 시안 · 실제 화면 캡처가 아닙니다</text><rect x="28" y="91" width="540" height="286" rx="8" fill="#edf0ea"/><text x="46" y="120" class="label">1  평소의 배치</text><rect class="screen" x="46" y="140" width="240" height="168" rx="5"/><rect x="47" y="292" width="238" height="15" fill="#d1d7d1"/><rect class="screen" x="310" y="140" width="240" height="168" rx="5"/><rect x="311" y="292" width="238" height="15" fill="#d1d7d1"/><text x="55" y="160" class="small">노트북</text><text x="319" y="160" class="small">외부 모니터</text><rect class="note" x="66" y="177" width="86" height="80" rx="4"/><rect class="bar" x="67" y="178" width="84" height="15" rx="3"/><text x="74" y="211" class="small">A 유지</text><rect class="note" x="330" y="177" width="86" height="80" rx="4"/><rect class="bar" x="331" y="178" width="84" height="15" rx="3"/><text x="338" y="211" class="small">B</text><rect class="note" x="427" y="177" width="104" height="111" rx="4"/><rect class="bar" x="428" y="178" width="102" height="15" rx="3"/><text x="435" y="211" class="small">C</text><text x="46" y="336" class="small">기존 위치·크기와 원래 모니터를 기억합니다.</text><rect x="592" y="91" width="540" height="286" rx="8" fill="#edf0ea"/><text x="610" y="120" class="label">2  외부 모니터 분리</text><rect class="screen" x="610" y="140" width="240" height="168" rx="5"/><rect x="611" y="292" width="238" height="15" fill="#d1d7d1"/><rect class="screen" x="874" y="140" width="240" height="168" rx="5"/><rect x="875" y="292" width="238" height="15" fill="#d1d7d1"/><text x="619" y="160" class="small">노트북</text><text x="883" y="160" class="small">분리됨</text><rect class="note" x="620" y="174" width="80" height="77" rx="4"/><rect class="bar" x="621" y="175" width="78" height="15" rx="3"/><text x="628" y="208" class="small">A 유지</text><rect class="note" x="710" y="174" width="120" height="47" rx="4"/><rect class="bar" x="711" y="175" width="118" height="15" rx="3"/><text x="718" y="208" class="small">B 피난</text><rect class="note" x="710" y="228" width="120" height="59" rx="4"/><rect class="bar" x="711" y="229" width="118" height="15" rx="3"/><text x="718" y="262" class="small">C 축소</text><rect x="875" y="167" width="238" height="124" fill="#edf0ea" opacity=".8"/><text x="610" y="336" class="small">정상 창은 그대로, 필요한 창만 이동·축소·분산합니다.</text><text x="610" y="356" class="small">툴바·크기 조절 영역과 Dock 위 작업 공간을 확보합니다.</text><rect x="28" y="401" width="540" height="286" rx="8" fill="#edf0ea"/><text x="46" y="430" class="label">3  재연결 · 직접 조작 우선</text><rect class="screen" x="46" y="450" width="240" height="168" rx="5"/><rect x="47" y="602" width="238" height="15" fill="#d1d7d1"/><rect class="screen" x="310" y="450" width="240" height="168" rx="5"/><rect x="311" y="602" width="238" height="15" fill="#d1d7d1"/><text x="55" y="470" class="small">노트북</text><text x="319" y="470" class="small">외부 모니터</text><rect class="note" x="66" y="487" width="86" height="80" rx="4"/><rect class="bar" x="67" y="488" width="84" height="15" rx="3"/><text x="74" y="521" class="small">A 유지</text><rect class="note" x="174" y="538" width="92" height="59" rx="4"/><rect class="bar" x="175" y="539" width="90" height="15" rx="3"/><text x="182" y="572" class="small">B 직접 이동</text><rect class="note" x="427" y="487" width="104" height="111" rx="4"/><rect class="bar" x="428" y="488" width="102" height="15" rx="3"/><text x="435" y="521" class="small">C 원복</text><text x="46" y="646" class="small">다시 연결하면 C는 원래 위치·크기로 돌아갑니다.</text><text x="46" y="666" class="small">사용자가 직접 옮긴 B는 새 배치를 유지합니다.</text><rect x="592" y="401" width="540" height="286" rx="8" fill="#edf0ea"/><text x="610" y="430" class="label">4  작업 상태 보존</text><rect class="screen" x="610" y="450" width="240" height="168" rx="5"/><rect x="611" y="602" width="238" height="15" fill="#d1d7d1"/><rect class="screen" x="874" y="450" width="240" height="168" rx="5"/><rect x="875" y="602" width="238" height="15" fill="#d1d7d1"/><text x="619" y="470" class="small">노트북</text><text x="883" y="470" class="small">외부 모니터</text><rect class="note" x="630" y="487" width="86" height="80" rx="4"/><rect class="bar" x="631" y="488" width="84" height="15" rx="3"/><text x="638" y="521" class="small">숨김 유지</text><rect class="note" x="894" y="487" width="148" height="94" rx="4"/><rect class="bar" x="895" y="488" width="146" height="15" rx="3"/><text x="902" y="521" class="small">초안·세션 유지</text><rect x="630" y="487" width="86" height="80" fill="#fff" opacity=".7"/><text x="610" y="646" class="small">숨긴 창을 열거나 포커스를 가져오지 않습니다.</text><text x="610" y="666" class="small">접힘·확대 원래 크기는 임시 피난 크기와 분리합니다.</text><text x="28" y="725" class="label">예외도 안전하게</text><text x="28" y="753" class="sub">화면 식별이 모호하면 안전 배치를 유지합니다. 창이 너무 많으면 메모 관리에서 개별 창을 열어 접근합니다.</text><text x="28" y="780" class="small">시안의 숫자·창 크기는 설명용입니다. 물리 모니터 전환·혼합 DPI·운영체제별 실검증은 별도 기록합니다.</text></svg>