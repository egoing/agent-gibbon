<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560"><rect width="1060" height="560" fill="#e6e8eb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="24" y="30" font-size="16" fill="#20252e">웹 주소 입력 → 실행 · Ctrl+Shift+4 영역 선택</text><rect x="24" y="52" width="650" height="400" rx="4" fill="#20252e" stroke="#667080"/><rect x="24" y="52" width="650" height="30" rx="4" fill="#303844"/><text x="36" y="72" fill="#f0f0f0" font-size="12">● ● ●　　　 Agent Gibbon · 웹</text><text x="109" y="196" fill="#f0f0f0" font-size="13" font-weight="600">웹 주소</text><rect x="109" y="209" width="480" height="36" rx="4" fill="#303844" stroke="#a8c5ff" stroke-width="2"/><text x="120" y="232" fill="#f0f0f0" font-size="13">https://example.com</text><text x="109" y="269" fill="#bac3cf" font-size="11">HTTP 또는 HTTPS 주소를 입력하세요.</text><rect x="109" y="290" width="72" height="32" rx="4" fill="#303844" stroke="#667080"/><text x="132" y="311" fill="#f0f0f0" font-size="13">실행</text><text x="710" y="70" fill="#20252e" font-size="14">작은 창 · 위에서부터 스크롤</text><rect x="710" y="90" width="320" height="200" rx="4" fill="#20252e" stroke="#667080"/><rect x="710" y="90" width="320" height="30" rx="4" fill="#303844"/><text x="723" y="110" fill="#f0f0f0" font-size="12">● ● ●　 웹</text><text x="726" y="150" fill="#f0f0f0" font-size="13" font-weight="600">웹 주소</text><rect x="726" y="163" width="288" height="32" rx="4" fill="#303844" stroke="#667080"/><text x="736" y="184" fill="#bac3cf" font-size="13">https://example.com</text><text x="726" y="216" fill="#bac3cf" font-size="11">HTTP 또는 HTTPS 주소를 입력하세요.</text><rect x="726" y="232" width="72" height="32" rx="4" fill="#303844" stroke="#667080"/><text x="749" y="253" fill="#f0f0f0" font-size="13">실행</text><text x="710" y="332" fill="#20252e" font-size="13">실행 후 별도 웹 콘텐츠 창으로 전환</text><text x="710" y="360" fill="#20252e" font-size="13">닫기와 CLI close는 페이지를 숨김</text><text x="710" y="388" fill="#20252e" font-size="13">CLI 복원은 현재 페이지를 유지</text><text x="24" y="496" fill="#20252e" font-size="13">기본 여백 24px · 좁거나 낮은 창 16px · 콘텐츠 최대 폭 480px · 최소 크기 240×160px</text><text x="24" y="530" fill="#20252e" font-size="12">설명용 시안 · 실제 앱 캡처 및 플랫폼별 네이티브 제목줄과 구분</text></g></svg>
