<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; fill: #2d2d2d; }
    .muted { fill: #626262; }
    .small { font-size: 14px; }
  </style>
  <rect width="1200" height="760" fill="#eceeed"/>
  <text x="40" y="42" font-size="24" font-weight="600">업데이트 안내 · 비포커스 시안</text>
  <text x="40" y="70" font-size="15" class="muted">서명된 다운로드가 준비되면 화면 위에 조용히 표시하고, 사용자의 현재 작업과 창 상태를 보존합니다.</text>

  <!-- Existing manager remains visible behind the notice. -->
  <rect x="40" y="104" width="760" height="474" fill="#f8f8f8" stroke="#858585"/>
  <rect x="40" y="104" width="760" height="40" fill="#f1f1f1" stroke="#858585"/>
  <text x="58" y="130" font-size="15" font-weight="600">Agent Gibbon · 메모 관리</text>
  <circle cx="764" cy="124" r="5" fill="#c8c8c8"/>
  <circle cx="781" cy="124" r="5" fill="#c8c8c8"/>
  <path d="M40 180H800 M226 144V578" stroke="#d6d6d6"/>
  <text x="60" y="170" font-size="16" font-weight="600">설정</text>
  <text x="70" y="215" font-size="14" class="muted">Privacy &amp; Diagnostics</text>
  <text x="70" y="253" font-size="14" class="muted">테마</text>
  <rect x="54" y="270" width="156" height="38" fill="#ffffff" stroke="#858585"/>
  <text x="68" y="295" font-size="14">자동 업데이트</text>
  <text x="252" y="218" font-size="20" font-weight="600">자동 업데이트</text>
  <rect x="252" y="240" width="512" height="166" fill="#f8f8f8" stroke="#d6d6d6"/>
  <text x="274" y="274" font-size="16" font-weight="600">새 버전 다운로드 완료</text>
  <text x="274" y="304" font-size="14" class="muted">현재 버전 0.2.7 · 새 버전 0.2.8</text>
  <text x="274" y="342" font-size="14">서명 검증 완료 · 설치 전 작업 보호 상태를 다시 확인합니다.</text>
  <text x="252" y="446" font-size="14" class="muted">관리 창의 위치와 포커스는 알림 표시 전과 동일하게 유지됩니다.</text>
  <text x="252" y="472" font-size="14" class="muted">숨긴 메모와 터미널은 다시 표시하지 않습니다.</text>

  <!-- Non-activating ready notice, layered above the unchanged manager. -->
  <rect x="638" y="180" width="520" height="356" fill="#000000" opacity="0.10" rx="7"/>
  <rect x="630" y="172" width="520" height="356" fill="#f8f8f8" stroke="#858585" rx="5"/>
  <path d="M635 172H1145Q1150 172 1150 177V205H630V177Q630 172 635 172Z" fill="#f1f1f1"/>
  <path d="M630 205H1150" stroke="#d6d6d6"/>
  <text x="650" y="194" font-size="13" class="muted">Agent Gibbon · 업데이트 준비 완료</text>
  <rect x="1034" y="182" width="96" height="20" rx="10" fill="#e7e7e7"/>
  <text x="1050" y="196" font-size="11" class="muted">비포커스</text>

  <text x="656" y="239" font-size="12" class="muted" letter-spacing="1">AGENT GIBBON · 업데이트</text>
  <text x="656" y="273" font-size="21" font-weight="600">새 버전이 준비됐습니다</text>
  <text x="656" y="302" font-size="14" class="muted">현재 버전 0.2.7</text>
  <text x="656" y="325" font-size="16" font-weight="600">새 버전 0.2.8</text>

  <rect x="656" y="345" width="468" height="38" fill="#f1f1f1" stroke="#d6d6d6" rx="4"/>
  <circle cx="675" cy="364" r="8" fill="#e2eee5" stroke="#688571"/>
  <path d="M671 364l3 3 6-7" fill="none" stroke="#486b50" stroke-width="1.8"/>
  <text x="692" y="369" font-size="13">다운로드와 서명 검증을 마쳤습니다.</text>

  <rect x="656" y="393" width="468" height="48" fill="#ffffff" stroke="#d6d6d6" rx="4"/>
  <text x="670" y="413" font-size="13" font-weight="600">자동 설치 보류</text>
  <text x="670" y="431" font-size="13">실행 중인 터미널이 있어 설치를 기다리고 있습니다.</text>

  <text x="656" y="462" font-size="12" class="muted">지금 선택하면 idle 대기만 생략합니다.</text>
  <text x="656" y="480" font-size="12" class="muted">작업 보호 검사는 계속 적용하며, 안전하지 않으면 보류합니다.</text>

  <rect x="806" y="490" width="110" height="30" fill="#ffffff" stroke="#858585" rx="3"/>
  <text x="839" y="510" font-size="13">나중에</text>
  <rect x="924" y="490" width="200" height="30" fill="#ffffff" stroke="#626262" rx="3"/>
  <text x="945" y="510" font-size="13" font-weight="600">업데이트하고 재시작</text>

  <path d="M884 536v22h-34" fill="none" stroke="#626262" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="884" cy="536" r="3" fill="#626262"/>
  <rect x="40" y="604" width="1110" height="106" fill="#f8f8f8" stroke="#d6d6d6" rx="4"/>
  <text x="62" y="635" font-size="15" font-weight="600">보존 규칙</text>
  <text x="62" y="663" font-size="14">알림은 포커스를 가져오지 않습니다. 현재 창의 위치·크기·포커스와 메모의 숨김 상태를 그대로 둡니다.</text>
  <text x="62" y="687" font-size="14">같은 버전 안내는 한 번만 표시합니다. ‘나중에’로 닫아도 숨긴 창을 다시 열지 않습니다.</text>
  <text x="40" y="738" font-size="12" class="muted">설명용 시안 · 예시 버전과 보류 사유는 설명용입니다 · 실제 앱 GUI 검증은 수행하지 않았습니다.</text>
</svg>
