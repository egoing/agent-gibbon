<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470"><rect width="1040" height="470" fill="#181818"/><g font-family="-apple-system,sans-serif" font-size="13" fill="#dfe2dd"><text x="24" y="30">메모 연결 · 툴바에서 시작하고 대상 클릭 후 설정</text><g fill="none" stroke="#606060"><rect x="16" y="52" width="320" height="320" rx="4"/><rect x="360" y="52" width="320" height="320" rx="4"/><rect x="704" y="52" width="320" height="320" rx="4"/></g><text x="32" y="80">① 툴바의 연결 버튼</text><rect x="36" y="112" width="280" height="100" rx="4" fill="#dfe2dd"/><text x="48" y="176" fill="#2c2f7e">기획 메모</text><g transform="translate(268 119) scale(.7)" fill="none" stroke="#2c2f7e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5M3 21l2.5 -2.5M18.5 5.5l2.5 -2.5M10 11l-2 2M13 14l-2 2"/></g><text x="32" y="250">텍스트 · 이미지 · 터미널 · 웹</text><text x="32" y="274">현재 메모에서 연결 시작</text><text x="376" y="80">② 포인터 추적 → 롤오버 → 클릭</text><g fill="#dfe2dd"><rect x="380" y="115" width="95" height="58" rx="4"/><rect x="550" y="210" width="110" height="70" rx="4"/></g><path d="M475 144C512 144 513 245 550 245" fill="none" stroke="#626590" stroke-width="2"/><rect x="547" y="207" width="116" height="76" fill="none" stroke="#a4a7d0" stroke-dasharray="5 4"/><text x="388" y="149" fill="#2c2f7e">출발 메모</text><text x="561" y="250" fill="#2c2f7e">대상 메모</text><text x="376" y="317">대상 경계에 미리 연결 · 클릭 확정</text><text x="376" y="341">Esc / 취소로 종료</text><text x="720" y="80">③ 연결 설정</text><rect x="724" y="103" width="280" height="250" rx="4" fill="#dfe2dd"/><g fill="#2c2f7e"><text x="742" y="130">메모 연결</text><text x="742" y="157">레이블 (선택)</text><rect x="740" y="166" width="248" height="30" fill="none" stroke="#626590" rx="4"/><text x="750" y="186">선행 작업</text><text x="742" y="220">화살표</text><rect x="740" y="231" width="248" height="30" fill="none" stroke="#626590" rx="4"/><text x="750" y="251">한쪽 — 클릭한 메모 방향</text><text x="804" y="294">취소</text><rect x="878" y="274" width="105" height="32" rx="4" fill="#626590"/><text x="916" y="295" fill="#fff">연결</text><text x="742" y="337">양쪽 / 한쪽 / 화살표 없음</text></g><text x="24" y="406">겹친 대상·자기 자신은 확정하지 않음 · 같은 두 메모를 다시 연결하면 설정 갱신</text><text x="24" y="432">선은 평소 클릭 통과 · 연결 모드에서만 포인터 입력 · 기존 메모의 위치·크기는 변경하지 않음</text><text x="24" y="456">설정 저장 후 클릭한 대상에 포커스 · 빈 레이블 허용 · 로컬 인스턴스에 저장</text></g></svg>
