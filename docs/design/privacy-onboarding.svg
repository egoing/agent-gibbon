<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="932" viewBox="0 0 1216 932"><rect width="1216" height="932" fill="#f2f2f2"/><style>text{font-family:Arial,sans-serif;fill:#2d2d2d}.title{font-size:22px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#646464}.label{font-size:16px;font-weight:600}</style><text x="32" y="37" class="title">Agent Gibbon / First-run consent and privacy settings</text><text x="32" y="63" class="small">Wireframe proposal • English labels • No diagnostic transmission without explicit consent</text><rect x="32" y="88" width="560" height="736" rx="8" fill="#f8f8f8" stroke="#858585"/><rect x="624" y="88" width="560" height="736" rx="8" fill="#f8f8f8" stroke="#858585"/><text x="56" y="119" class="small">01  FIRST LAUNCH</text><text x="1148" y="119" class="body">×</text><text x="64" y="170" class="title">Welcome to Agent Gibbon</text><text x="64" y="203" class="label">Terms &amp; Privacy</text><text x="64" y="237" class="body">Nothing is sent until you choose.</text><rect x="64" y="260" width="496" height="152" rx="8" fill="#ffffff" stroke="#d6d6d6"/><text x="82" y="288" class="label">Terms of Use</text><text x="82" y="314" class="small">Local desktop app. Your content stays on your device.</text><rect x="82" y="328" width="140" height="38" rx="8" fill="#f8f8f8" stroke="#858585"/><text x="96" y="352" class="body">Read Terms</text><path d="M82 377H542" stroke="#ddd"/><rect x="82" y="386" width="18" height="18" rx="2" fill="#f8f8f8" stroke="#d6d6d6"/><text x="112" y="401" class="body">I agree to the Terms of Use (required)</text><rect x="64" y="432" width="496" height="288" rx="8" fill="#ffffff" stroke="#d6d6d6"/><text x="82" y="461" class="label">Service improvement diagnostics</text><text x="82" y="490" class="small">Error categories, app/OS versions, operation timings.</text><text x="82" y="515" class="small">No note content, terminal input/output or screenshots.</text><rect x="82" y="535" width="150" height="38" rx="8" fill="#f8f8f8" stroke="#858585"/><text x="96" y="559" class="body">Privacy Notice</text><rect x="82" y="589" width="460" height="66" rx="8" fill="#ffffff" stroke="#d6d6d6"/><text x="96" y="615" class="small">Original diagnostic data: up to 30 days.</text><text x="96" y="638" class="small">Backups and issue totals follow separate rules.</text><path d="M82 670H542" stroke="#ddd"/><rect x="82" y="684" width="18" height="18" rx="2" fill="#f8f8f8" stroke="#d6d6d6"/><text x="112" y="699" class="small">I agree to diagnostic sharing (optional)</text><text x="64" y="739" class="small">You can use every feature without sharing diagnostics.</text><rect x="64" y="762" width="96" height="38" rx="8" fill="#f8f8f8" stroke="#858585"/><text x="78" y="786" class="body">Exit</text><rect x="424" y="762" width="136" height="38" rx="8" fill="#ececec" stroke="#858585"/><text x="438" y="786" class="small">Continue</text><text x="648" y="119" class="small">02  SETTINGS</text><text x="656" y="166" class="label">All Memos     Settings</text><text x="656" y="215" class="title">Privacy &amp; Diagnostics</text><text x="656" y="249" class="body">Your choice is stored locally.</text><rect x="656" y="277" width="496" height="264" rx="8" fill="#ffffff" stroke="#d6d6d6"/><text x="674" y="310" class="label">Diagnostic sharing (optional)</text><rect x="1068" y="288" width="64" height="32" rx="16" fill="#e6e6e6" stroke="#858585"/><rect x="1072" y="292" width="24" height="24" rx="12" fill="#f8f8f8" stroke="#858585"/><text x="674" y="342" class="label">Not sharing</text><text x="674" y="375" class="small">Includes only when enabled:</text><text x="690" y="401" class="body">• Sanitized errors and app / OS versions</text><text x="690" y="429" class="body">• Performance timings and freeze diagnostics</text><text x="674" y="470" class="small">Never includes:</text><text x="690" y="497" class="small">• Notes, terminal input/output, clipboard, screens</text><text x="674" y="523" class="small">No consent = no diagnostic upload.</text><text x="656" y="585" class="body">Turning off saves withdrawal immediately.</text><text x="656" y="611" class="small">Turning on requires Save Changes.</text><text x="656" y="637" class="small">Previously uploaded data is handled separately.</text><rect x="656" y="665" width="142" height="38" rx="8" fill="#f8f8f8" stroke="#858585"/><text x="670" y="689" class="body">Read Terms</text><rect x="814" y="665" width="154" height="38" rx="8" fill="#f8f8f8" stroke="#858585"/><text x="828" y="689" class="body">Privacy Notice</text><rect x="974" y="760" width="178" height="38" rx="8" fill="#f8f8f8" stroke="#858585"/><text x="988" y="784" class="body">Save Changes</text><text x="656" y="714" class="small">Optional sharing is available and starts unchecked.</text><text x="32" y="862" class="body">Required terms and optional diagnostics are separate. Both start unchecked on first launch.</text><text x="32" y="890" class="small">This wireframe is a review artifact; layout values remain proposals until implementation verification.</text></svg>