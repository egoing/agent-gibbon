<text x="78" y="748" font-size="13" class="muted">공식 호환 쌍이 없는 배포 빌드는 두 왕복 버튼을 비활성화하고 이유를 표시합니다.</text>
<text x="78" y="774" font-size="13" class="muted">5회 클릭 진입 유지 · 기본 숨김 · 서명과 작업 보호 유지 · 최신 복귀 확인 후 일반 자동 업데이트 재개</text>
