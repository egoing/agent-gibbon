<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450">
<defs><pattern id="desk" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#d8dde4"/><rect width="10" height="10" fill="#bac3ce"/><rect x="10" y="10" width="10" height="10" fill="#bac3ce"/></pattern></defs>
<rect width="1080" height="450" fill="#f3f4f6"/>
