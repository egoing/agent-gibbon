<text x="664" y="371" class="muted">…/작업폴더/src-tauri/target/debug/agent-gibbon</text>
<text x="664" y="394" class="muted">실행 정보 펼치기 ▾  ·  전체 경로 / 인스턴스 / 서명 확인 상태</text>
