<rect x="408" y="450" width="168" height="32" rx="4" fill="#2d2d2d" stroke="#858585"/>
<text x="420" y="471" class="white">설정 열기</text>
<text x="640" y="98" class="muted">02  이미 허용했어요 → 앱 일치 여부 안내</text>
<rect x="640" y="110" width="568" height="396" rx="4" fill="#f8f8f8" stroke="#d6d6d6"/>
<text x="664" y="139" class="muted">Agent Gibbon · 화면 캡처</text>
<text x="664" y="177" class="heading">설정의 앱과 현재 앱을 확인해 주세요</text>
<text x="664" y="204" class="">같은 이름의 다른 설치본이나 개발 앱을 허용했을 수 있습니다.</text>
<text x="664" y="232" class="">개발 앱은 재빌드·서명 변경 후 다시 확인이 필요할 수 있습니다.</text>
<text x="664" y="254" class="muted">현재 실패의 원인이 재빌드로 확정된 것은 아닙니다.</text>
<text x="664" y="280" class="muted">OS에서 종료·재실행을 요청했다면 작업을 저장한 뒤 진행하세요.</text>
<path d="M664 298h520" stroke="#d6d6d6"/>
