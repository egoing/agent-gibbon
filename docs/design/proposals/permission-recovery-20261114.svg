<text x="56" y="347" class="muted">버전 0.2.11  ·  PID 4242</text>
<text x="56" y="371" class="muted">/Applications/Agent Gibbon.app</text>
<text x="56" y="394" class="muted">실행 정보 펼치기 ▾  ·  전체 경로 / 인스턴스 / 서명 확인 상태</text>
<rect x="56" y="450" width="72" height="32" rx="4" fill="#fff" stroke="#858585"/>
