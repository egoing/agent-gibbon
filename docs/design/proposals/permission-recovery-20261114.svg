<text x="32" y="544" class="muted">03  다시 확인 → 진행 상태</text>
<rect x="32" y="556" width="568" height="396" rx="4" fill="#f8f8f8" stroke="#d6d6d6"/>
<text x="56" y="585" class="muted">Agent Gibbon · 화면 캡처</text>
<text x="56" y="623" class="heading">화면 캡처 접근을 확인하는 중입니다</text>
<text x="56" y="650" class="">권한 상태를 다시 읽고 있습니다. 캡처는 아직 시작하지 않습니다.</text>
<text x="56" y="678" class="heading">확인 중…</text>
<text x="56" y="705" class="muted">중복 확인을 막고 결과를 이 안내에 표시합니다.</text>
<text x="56" y="735" class="muted">시간 초과나 조회 오류는 권한 거부로 표시하지 않습니다.</text>
<path d="M56 744h520" stroke="#d6d6d6"/>
