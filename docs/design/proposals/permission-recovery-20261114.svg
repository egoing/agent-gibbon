<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1160" viewBox="0 0 1240 1160"><style>text{font-family:"Apple SD Gothic Neo",sans-serif;fill:#2d2d2d;font-size:13px}.muted{fill:#626262}.heading{font-size:18px;font-weight:600}.white{fill:white}</style><rect width="1240" height="1160" fill="#eceeed"/>
<text x="32" y="39" class="heading">화면 캡처 권한 복구 안내</text>
<text x="32" y="65" class="muted">#137 · 승인 전 제안 · macOS 예시 · 앱·PID·경로는 설명용 가상 값 · 실제 OS 화면 아님</text>
<text x="32" y="98" class="muted">01  접근 확인 실패 → 최초 안내</text>
<rect x="32" y="110" width="568" height="396" rx="4" fill="#f8f8f8" stroke="#d6d6d6"/>
<text x="56" y="139" class="muted">Agent Gibbon · 화면 캡처</text>
<text x="56" y="177" class="heading">화면 캡처 접근을 확인할 수 없습니다</text>
<text x="56" y="204" class="">영역 캡처를 시작하지 못했습니다. 아래 설정을 확인해 주세요.</text>
<text x="56" y="232" class="">시스템 설정 → 개인정보 보호 및 보안 →</text>
<text x="56" y="254" class="heading">화면 및 시스템 오디오 녹음</text>
<text x="56" y="280" class="muted">목록에서 현재 실행 앱의 화면 기록을 허용해 주세요.</text>
<path d="M56 298h520" stroke="#d6d6d6"/>
