<text x="404" y="917" class="muted">확인 중…</text>
<text x="640" y="544" class="muted">04  권한 외 캡처 오류 → 별도 안내</text>
<rect x="640" y="556" width="568" height="396" rx="4" fill="#f8f8f8" stroke="#d6d6d6"/>
<text x="664" y="585" class="muted">Agent Gibbon · 화면 캡처</text>
<text x="664" y="623" class="heading">화면 캡처를 완료하지 못했습니다</text>
<text x="664" y="650" class="">화면 캡처 접근 확인은 통과했지만 캡처 작업이 실패했습니다.</text>
<text x="664" y="678" class="heading">오류 정보  ▾</text>
<text x="664" y="705" class="muted">작업 단계와 오류 코드만 표시합니다. 화면 원문은 표시하지 않습니다.</text>
<text x="664" y="735" class="muted">권한을 다시 부여하라고 안내하지 않습니다.</text>
