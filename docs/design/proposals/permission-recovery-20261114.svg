<text x="32" y="990" class="heading">재확인 결과</text>
<text x="32" y="1018" class="">접근 확인됨 → 「캡처 시작」을 사용자가 눌러 재개     /     확인 안 됨 → 01·02 안내 유지</text>
<text x="32" y="1045" class="">조회 실패·시간 초과 → 「확인하지 못했습니다」 + 다시 확인     /     OS 재실행 요청 → 저장 후 수동 재실행 안내</text>
<text x="32" y="1082" class="muted">비포커스 안내  ·  나중에 / 닫기는 캡처만 취소  ·  기존 메모 위치·표시·숨김 유지  ·  자동 재시작 없음</text>
<text x="32" y="1108" class="muted">Orca·Codex의 손쉬운 사용 권한과 Agent Gibbon의 화면 캡처 권한은 별개입니다.</text>
<text x="32" y="1134" class="muted">버튼 동작·OS 설정 이동·권한 귀속·재실행 복원은 구현 전 실환경 검증이 필요합니다.</text>
