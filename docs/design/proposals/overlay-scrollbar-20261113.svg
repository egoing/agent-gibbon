  <path d="M6 6l12 12" /></svg><text x="3" y="36" font-size="15" font-weight="600" letter-spacing="-.3">곁에 두고 보기</text><text x="3" y="55" font-size="12" font-weight="400" letter-spacing="-.3">캡처, 메모, 터미널, 브라우저를 다른 창 위에 띄워 두고,</text><text x="3" y="72" font-size="12" font-weight="400" letter-spacing="-.3">작업 중에 편하게 참조하세요.</text><text x="3" y="89" font-size="12" font-weight="400" letter-spacing="-.3">메뉴 막대나 트레이에서 필요한 기능을 고른 뒤,</text><text x="3" y="106" font-size="12" font-weight="400" letter-spacing="-.3">화면에 원하는 영역을 그려 보세요.</text><text x="3" y="123" font-size="12" font-weight="400" letter-spacing="-.3">•  영역 캡처 · 화면 일부를 찍어 곁에 두세요.</text><text x="3" y="140" font-size="12" font-weight="400" letter-spacing="-.3">•  영역 텍스트 메모 · 기억할 내용을 적어 두세요.</text><text x="3" y="157" font-size="12" font-weight="400" letter-spacing="-.3">•  영역 터미널 · 명령을 실행하고 결과를 확인하세요.</text><text x="3" y="174" font-size="12" font-weight="400" letter-spacing="-.3">•  영역 웹 창 · 웹 주소를 열어 자료를 함께 보세요.</text><text x="3" y="191" font-size="12" font-weight="600" letter-spacing="-.3">이 메모로 시작해 보세요</text><text x="3" y="210" font-size="12" font-weight="400" letter-spacing="-.3">본문을 드래그해 옮기고, 가장자리를 끌어 크기를</text><text x="3" y="227" font-size="12" font-weight="400" letter-spacing="-.3">조절하세요. 연필 버튼으로 내용을 고쳐 쓸 수 있어요.</text><text x="3" y="244" font-size="12" font-weight="400" letter-spacing="-.3">숨긴 창은 메뉴 막대나 트레이에서 다시 열 수 있어요.</text><text x="3" y="261" font-size="12" font-weight="400" letter-spacing="-.3">각 기능의 단축키도 메뉴에서 확인하세요.</text><text x="3" y="278" font-size="12" font-weight="400" letter-spacing="-.3">필요한 자료를 곁에 두고 작업을 이어 가세요.</text><text x="3" y="295" font-size="12" font-weight="400" letter-spacing="-.3">메모가 길어지면 아래로 스크롤해 읽을 수 있어요.</text><text x="3" y="312" font-size="12" font-weight="400" letter-spacing="-.3">이어서 볼 내용이 아래에 더 있습니다.</text><text x="3" y="329" font-size="12" font-weight="400" letter-spacing="-.3">마지막 문단까지 같은 방식으로 스크롤합니다.</text></g></g><text x="40" y="615" font-size="14" fill="#b9bcb5">툴바 아래 빈 띠와 스크롤바 전용 열 제거</text><text x="560" y="108" font-size="16">호버 / 스크롤 · 얇은 thumb 노출</text><g transform="translate(560,125) scale(1.6)"><defs><clipPath id="clip1"><rect width="300" height="291" rx="4"/></clipPath></defs><g clip-path="url(#clip1)"><rect width="300" height="291" rx="4" fill="#262626"/><svg x="103" y="5" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#d7d9d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v-2h13v2" />
