/g><text x="560" y="615" font-size="14" fill="#b9bcb5">표시 폭 3px · 오른쪽 끝에 겹침 · 트랙 배경 없음</text><text x="40" y="660" font-size="14" fill="#dedfdb">제안: 툴바 30 → 22px · 본문 상단 추가 여백 0 · 좌우 최소 3px는 글자 보호용으로 유지</text><text x="40" y="687" font-size="14" fill="#a7aaa5">폭을 차지하는 스크롤바 열 없이 본문 확장 · 오른쪽 가장자리 접근 / 스크롤 / 키보드 초점 시 표시</text><text x="40" y="711" font-size="12" fill="#8d9189">스크롤 가능한 메모만 표시 · 초기 1회 짧게 안내 · 드래그 중 유지 · 접근성 설정에서는 상시 표시 제안</text></g></svg>