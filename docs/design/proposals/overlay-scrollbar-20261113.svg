<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730"><rect width="1080" height="730" fill="#171717"/><g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif" fill="#dedfdb"><text x="40" y="40" font-size="22" font-weight="600">본문을 넓히는 오버레이 스크롤바</text><text x="40" y="66" font-size="14" fill="#a7aaa5">제안 시안 · 승인 전 · 실제 앱 캡처 아님 · 첨부 메모 비율을 유지한 1.6배 확대</text><text x="40" y="108" font-size="16">기본 · 읽는 동안 표시 숨김</text><g transform="translate(40,125) scale(1.6)"><defs><clipPath id="clip0"><rect width="300" height="291" rx="4"/></clipPath></defs><g clip-path="url(#clip0)"><rect width="300" height="291" rx="4" fill="#262626"/><svg x="103" y="5" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#d7d9d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v-2h13v2" />
