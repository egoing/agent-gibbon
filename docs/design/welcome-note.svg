<svg xmlns="http://www.w3.org/2000/svg" width="380" height="390" viewBox="0 0 380 390">
<rect width="380" height="390" fill="#f3f4f6"/>
<rect x="39" y="23" width="302" height="334" rx="4" fill="#dfe2dd" stroke="#a0a3bc"/>
<g font-family="Apple SD Gothic Neo, sans-serif" fill="#2c2f7e" letter-spacing="-.3">
<text x="44" y="42" font-size="15" font-weight="600">곁에 두고 보기</text>
<text x="44" y="65" font-size="12" font-weight="400">캡처, 메모, 터미널, 브라우저를 다른 창 위에</text>
<text x="44" y="82" font-size="12" font-weight="400">띄워 두고, 작업 중에 편하게 참조하세요.</text>
<text x="44" y="105" font-size="12" font-weight="400">메뉴 막대나 트레이에서 필요한 기능을 고른 뒤,</text>
<text x="44" y="122" font-size="12" font-weight="400">화면에 원하는 영역을 그려 보세요.</text>
<text x="44" y="145" font-size="12" font-weight="400">• 영역 캡처 · 화면 일부를 찍어 곁에 두세요.</text>
<text x="44" y="162" font-size="12" font-weight="400">• 영역 텍스트 메모 · 기억할 내용이나 할 일을</text>
<text x="44" y="179" font-size="12" font-weight="400">  적어 두세요.</text>
<text x="44" y="196" font-size="12" font-weight="400">• 영역 터미널 · 명령을 실행하고 결과를 확인하세요.</text>
<text x="44" y="213" font-size="12" font-weight="400">• 영역 웹 창 · 웹 주소를 열어 자료를 함께 보세요.</text>
<text x="44" y="236" font-size="12" font-weight="600">이 메모로 시작해 보세요</text>
<text x="44" y="259" font-size="12" font-weight="400">본문을 드래그해 옮기고, 가장자리를 끌어 크기를</text>
<text x="44" y="276" font-size="12" font-weight="400">조절하세요. 연필 버튼으로 내용을 고쳐 쓸 수 있어요.</text>
<text x="44" y="299" font-size="12" font-weight="400">숨긴 창은 메뉴 막대나 트레이에서 다시 열 수 있어요.</text>
<text x="44" y="316" font-size="12" font-weight="400">각 기능의 단축키도 메뉴에서 확인하세요.</text>
</g>
<text x="40" y="378" font-family="Apple SD Gothic Neo, sans-serif" font-size="10" fill="#555">최초 메모 · 본문 구성 시안 (툴바 생략)</text>
</svg>