<rect x="824" y="193" width="66" height="24" rx="4" fill="#dfe2dd" stroke="#626590"/><text x="857" y="209" fill="#2c2f7e" text-anchor="middle">선행 작업</text>
<text x="32" y="292">관련 선 숨김 · 위치 계산 중단</text><text x="376" y="292">숨김 유지·복원 중에도 계산 중단</text><text x="720" y="292">좌표 계산 → SVG 반영 → 재표시</text>
<text x="20" y="365">누른 채 멈춰도 관련 선은 숨김 유지 · 관계없는 선은 유지 · 예전 표시 요청은 폐기</text><text x="20" y="388">자동 이동·크기 변경은 150ms 안정화 유지 · 최신 양끝과 현재 SVG 세대 확인 후 표시 · 연결선 클릭 통과</text>
<path d="M20 410H1020" stroke="#606060"/>
<text x="20" y="434">표시 전제: 같은 인스턴스의 메모 하나라도 포커스 → 전체 관계선 표시</text>
<text x="20" y="456">다른 앱·관리창에 포커스 → 전체 관계선 숨김 · 이동/전체 숨김 규칙은 계속 적용</text>
<path d="M20 480H1020" stroke="#606060"/>
<text x="20" y="507">종류별 예제 · 텍스트 → 이미지 → 터미널 → 웹 → 기획에 반영</text>
