<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620">
<rect width="1040" height="620" fill="#181818"/>
<g font-family="-apple-system,sans-serif" font-size="13" fill="#dfe2dd">
<text x="20" y="30">메모 관계선 · 이동과 숨김 중 계산 중단 · 조사용 프로토타입</text>
<g fill="none" stroke="#606060"><rect x="16" y="60" width="320" height="274" rx="4"/><rect x="360" y="60" width="320" height="274" rx="4"/><rect x="704" y="60" width="320" height="274" rx="4"/></g>
<text x="32" y="92">① 메모 드래그 시작 · 누른 채 정지</text><text x="376" y="92">② 전체 숨김·복원 전환 중</text><text x="720" y="92">③ 버튼을 놓거나 창 이동을 마친 뒤</text>
<g fill="#dfe2dd"><rect x="36" y="150" width="90" height="58" rx="4" opacity=".35"/><rect x="146" y="150" width="90" height="58" rx="4"/><rect x="558" y="236" width="90" height="24" rx="4" opacity=".3"/><rect x="724" y="150" width="90" height="58" rx="4"/><rect x="914" y="202" width="90" height="58" rx="4"/></g>
<g fill="#2c2f7e"><text x="154" y="183">메모 A</text><text x="732" y="183">메모 A</text><text x="922" y="235">메모 B</text></g>
<text x="130" y="185">→</text><text x="376" y="183">메모를 숨기거나 복원하는 동안</text><text x="376" y="207">관계선은 표시하지 않습니다.</text>
