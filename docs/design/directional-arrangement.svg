<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">보이는 네 유형의 명시적 왼쪽·오른쪽 정렬</title><desc id="desc">텍스트, 이미지와 캡처, 터미널, 웹을 함께 정렬한다. 숨긴 창은 열지 않는다. 위로 메모 보기를 열고 Escape로 방향 선택을 취소한다.</desc>
<rect width="900" height="360" fill="#fff"/><g font-family="sans-serif" fill="#24313c"><text x="24" y="30" font-size="20">Control Option Command · 포인터 방향</text><text x="24" y="57" font-size="14">← 왼쪽 정렬 · → 오른쪽 정렬 · ↑ 메모 모아보기 · ↓ 숨김 / 복원 · Esc 취소</text></g>
<g fill="#eef1f4" stroke="#85919b"><rect x="24" y="76" width="410" height="220" rx="6"/><rect x="466" y="76" width="410" height="220" rx="6"/></g>
